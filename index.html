<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ImageCompressorPro<!-- leaving a note for later --></title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <main class="container">
        <h1>ImageCompressorPro</h1>
        <section class="upload-section">
            <input type="file" id="fileInput" accept="image/*">
            <label for="fileInput" class="drop-zone">
                <p>Drag & drop an image here or click to select</p>
                <img id="preview" src="#" alt="Preview" hidden>
            </label>
            <button id="compressBtn" disabled>Compress Image</button>
            <p id="statusMessage" class="status"></p>
        </section>
    </main>

    <script src="script.js" type="module"></script>
</body>
</html>
